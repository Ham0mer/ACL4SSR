    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 备用
    type: select
    proxies:
      - ☑️ 手动切换
      - 🎯 全球直连
  - name: ☁️ CloudFlareCDN
    type: select
    proxies:
      - ☑️ 手动切换
      - 🎯 全球直连
