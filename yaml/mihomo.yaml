external-controller: 127.0.0.1:9090
proxies:
  # LEAVE THIS LINE!
proxy-groups:
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      # LEAVE THIS LINE!
  - name: ☑️ 手动切换
    type: select
    proxies:
      - ♻️ 自动选择
